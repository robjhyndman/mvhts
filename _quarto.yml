    journal:
      name: TBD
      formatting: preprint
      cite-style: authoryear
pdf-engine: pdflatex
keep-tex: true
papersize: a4
fontfamily: mathpazo
fig-pos: "!htb"
include-in-header: preamble.tex
number-depth: 2
colorlinks: true
linkcolor: black
citecolor: black
urlcolor: black
